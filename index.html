<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game PRD Analyzer | 游戏策划需求解析器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2317191c'/%3E%3Cpath d='M32 28h36v44H32z' fill='none' stroke='%23ffffff' stroke-width='4'/%3E%3Cpath d='M40 40h20M40 52h14' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='62' cy='62' r='11' fill='none' stroke='%23fbe1d1' stroke-width='5'/%3E%3Cpath d='M70 70l9 9' stroke='%23fbe1d1' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;430;450;480;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #17191c;
      --paper: #ffffff;
      --mist: #f2f2f3;
      --fog: #fafafb;
      --slate: #777b86;
      --ash: #979799;
      --smoke: #a3a6af;
      --peach: #fbe1d1;
      --sienna: #5d2a1a;
      --border: #ececec;
      --shadow: 0 0 0 1px rgba(4,23,43,0.05), 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
      --shadow-sm: 0 0 0 1px rgba(4,23,43,0.05), 0 4px 12px rgba(0,0,0,0.06);
    }
    * { font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif; }
    body {
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .font-serif { font-family: 'Noto Serif SC', 'Source Serif 4', Georgia, serif; }
    .font-sans { font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif; }
    .section-title {
      font-family: 'Noto Serif SC', 'Source Serif 4', Georgia, serif;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .text-ink { color: var(--ink); }
    .text-slate { color: var(--slate); }
    .text-ash { color: var(--ash); }
    .bg-mist { background-color: var(--mist); }
    .bg-fog { background-color: var(--fog); }
    .bg-peach { background-color: var(--peach); }
    .text-sienna { color: var(--sienna); }
    .border-hairline { border-color: var(--border); }
    .card {
      background: var(--mist);
      border-radius: 24px;
      border: 1px solid transparent;
    }
    .card-white {
      background: var(--paper);
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .btn-pill {
      border-radius: 9999px;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .btn-pill-primary {
      background: var(--ink);
      color: var(--paper);
    }
    .btn-pill-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(23,25,28,0.2);
    }
    .btn-pill-primary:disabled {
      background: #d1d1d3;
      color: #777b86;
      cursor: not-allowed;
    }
    .btn-pill-ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink);
    }
    .btn-pill-ghost:hover {
      background: rgba(23,25,28,0.04);
    }
    .input-field {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 16px;
      transition: all 0.2s ease;
    }
    .input-field:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(23,25,28,0.06);
      outline: none;
    }
    .drop-zone {
      background: var(--fog);
      border: 2px dashed #d4d4d8;
      border-radius: 24px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .drop-zone:hover {
      border-color: var(--sienna);
      background: rgba(251,225,209,0.35);
    }
    .drop-zone.drag-over {
      border-color: var(--sienna);
      background: rgba(251,225,209,0.55);
      transform: scale(1.005);
    }
    .step-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .step-badge-inactive { background: var(--mist); color: var(--slate); }
    .step-badge-active { background: var(--ink); color: var(--paper); }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.pending { background: var(--ash); }
    .status-dot.processing { background: var(--ink); animation: pulse 1.5s infinite; }
    .status-dot.success { background: #10b981; }
    .status-dot.error { background: #ef4444; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .output-section {
      background: var(--paper);
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 28px;
      margin-bottom: 16px;
    }
    .output-section-title {
      font-family: 'Noto Serif SC', 'Source Serif 4', Georgia, serif;
      font-size: 22px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .missing-tag {
      background: var(--peach);
      color: var(--sienna);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
    }
    .supplement-tag {
      background: var(--fog);
      color: var(--slate);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 13px;
      border: 1px solid var(--border);
    }
    .step-nav-item {
      padding: 8px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .step-nav-item:hover { background: var(--mist); }
    .step-nav-item.active { background: var(--ink); color: var(--paper); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #b0b0b4; }
    .artifact-card {
      background: var(--paper);
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 20px;
    }
    .toast {
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .wireframe-device {
      background: #1a1a1e;
      border-radius: 28px;
      padding: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      display: inline-block;
    }
    .wireframe-screen {
      background: #121214;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }
    .sidebar-scroll::-webkit-scrollbar { width: 5px; }
    .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 3px; }
    .sidebar-scroll::-webkit-scrollbar-thumb:hover { background: #b0b0b4; }
    .missing-banner {
      background: linear-gradient(135deg, #fff8f5 0%, #fff0e9 100%);
      border: 1px solid #fbe1d1;
      border-radius: 20px;
      padding: 20px;
    }
    .missing-banner-title { color: var(--sienna); font-weight: 600; }
    .missing-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 0;
      font-size: 14px;
      color: var(--sienna);
    }
    .missing-item::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--sienna);
      margin-top: 8px;
      flex-shrink: 0;
    }
    .output-card {
      background: var(--paper);
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 28px;
      box-shadow: var(--shadow-sm);
    }
    .wireframe-screen-pc {
.wireframe-screen-pc {
      background: #121214;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 8px solid #2a2a2e;
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="app" class="min-h-screen flex">
    <!-- Left Sidebar -->
    <aside class="w-[380px] flex-shrink-0 bg-paper border-r border-hairline h-screen sticky top-0 overflow-y-auto z-10">
      <div class="p-6 space-y-6">
        <!-- Header -->
        <header>
          <p class="text-xs text-ash font-medium tracking-wider mb-2">GAME PRD ANALYZER</p>
          <h1 class="text-2xl section-title leading-tight">把策划需求拆成<br>交互设计师能用的结构</h1>
        </header>

        <!-- Upload -->
        <section>
          <div class="flex items-center gap-2 mb-3">
            <span class="step-badge step-badge-active">1</span>
            <h2 class="text-sm font-semibold text-ink">输入策划文档</h2>
          </div>
          <label id="dropZone" for="fileUpload" class="drop-zone block p-8 text-center cursor-pointer relative">
            <input type="file" id="fileUpload" accept=".txt,.md,.docx,.xlsx,.xls" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            <div class="pointer-events-none">
              <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-peach/60 flex items-center justify-center text-sienna">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
              </div>
              <p class="text-sm text-ink font-medium mb-1">拖拽文档到这里</p>
              <p class="text-xs text-slate">支持 TXT / MD / DOCX / Excel</p>
            </div>
          </label>

          <div id="fileInfo" class="hidden mt-3 p-3 rounded-xl bg-fog border border-hairline">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-peach/50 flex items-center justify-center text-sienna">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <div>
                  <p id="fileName" class="text-xs text-ink font-medium max-w-[180px] truncate"></p>
                  <p id="fileStatus" class="text-xs text-slate mt-0.5 flex items-center gap-1.5">
                    <span class="status-dot pending"></span>
                    <span>等待解析...</span>
                  </p>
                </div>
              </div>
              <button onclick="removeFile()" class="text-xs text-slate hover:text-ink font-medium px-2 py-1 rounded-lg hover:bg-mist transition-colors">移除</button>
            </div>
          </div>

          <div class="mt-3 flex items-center justify-between">
            <button onclick="toggleManualInput()" class="text-xs text-slate hover:text-ink font-medium flex items-center gap-1 transition-colors">
              <span id="manualToggleText">手动粘贴文本</span>
              <svg id="manualToggleIcon" class="w-3 h-3 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
            <div class="flex items-center gap-2">
              <button onclick="loadExample()" class="text-xs text-ash hover:text-ink transition-colors">加载示例</button>
              <button onclick="clearInput()" class="text-xs text-ash hover:text-red-500 transition-colors">清空</button>
            </div>
          </div>
          <div id="manualInputArea" class="hidden mt-3">
            <textarea id="prdInput" placeholder="在此粘贴游戏系统策划方案 / PRD 文本（可选）..." class="w-full h-32 input-field p-3 text-sm text-ink placeholder-ash resize-y custom-scrollbar"></textarea>
          </div>
        </section>

        <!-- AI Config -->
        <section>
          <div class="flex items-center gap-2 mb-3">
            <span class="step-badge step-badge-inactive">2</span>
            <h2 class="text-sm font-semibold text-ink">AI 模型配置</h2>
          </div>
          <div class="space-y-3">
            <div>
              <label class="block text-xs text-slate mb-1.5 font-medium">选择 AI 模型 <span class="text-sienna">*</span></label>
              <div class="relative">
                <select id="aiModel" class="input-field w-full rounded-2xl px-3 py-2.5 text-sm text-ink appearance-none cursor-pointer bg-paper">
                  <option value="" disabled selected>— 请选择模型 —</option>
                  <optgroup label="Anthropic（结构化分析最强）">
                    <option value="anthropic:claude-opus-4-3-20261105">Claude Opus 4.3 ⭐ 最强推理</option>
                    <option value="anthropic:claude-sonnet-4-20261105">Claude Sonnet 4 ⭐ 综合推荐</option>
                    <option value="anthropic:claude-haiku-4-20261105">Claude Haiku 4（快且便宜）</option>
                    <option value="anthropic:claude-3-5-sonnet-20241022">Claude Sonnet 3.5</option>
                    <option value="anthropic:claude-3-opus-20240229">Claude Opus 3</option>
                  </optgroup>
                  <optgroup label="OpenAI（视觉与输出稳定）">
                    <option value="openai:gpt-5.5">GPT-5.5 ⭐ 最强综合</option>
                    <option value="openai:gpt-4.1">GPT-4.1</option>
                    <option value="openai:gpt-4o">GPT-4o（支持图片）</option>
                    <option value="openai:gpt-4o-mini">GPT-4o mini（轻量）</option>
                    <option value="openai:o3-mini">o3-mini（推理型）</option>
                    <option value="openai:o1">o1（深度推理）</option>
                  </optgroup>
                  <optgroup label="Google（超长上下文 + 视觉）">
                    <option value="google:gemini-2.5-pro">Gemini 2.5 Pro ⭐ 长文+视觉</option>
                    <option value="google:gemini-2.0-flash">Gemini 2.0 Flash（快）</option>
                    <option value="google:gemini-1.5-pro">Gemini 1.5 Pro</option>
                  </optgroup>
                  <optgroup label="阿里云（中文视觉）">
                    <option value="aliyun:qwen-vl-max">Qwen-VL-Max（支持图片）</option>
                    <option value="aliyun:qwen2.5-vl-72b-instruct">Qwen2.5-VL 72B</option>
                    <option value="aliyun:qwen-max">Qwen-MAX（纯文本）</option>
                  </optgroup>
                  <optgroup label="Moonshot（中文长文本）">
                    <option value="moonshot:kimi-k1-5">Kimi k1.5</option>
                    <option value="moonshot:kimi-k2">Kimi K2</option>
                  </optgroup>
                  <optgroup label="DeepSeek（中文文本，高性价比）">
                    <option value="deepseek:deepseek-chat">DeepSeek-V3</option>
                    <option value="deepseek:deepseek-reasoner">DeepSeek-R1（推理型）</option>
                  </optgroup>
                  <optgroup label="SiliconFlow">
                    <option value="siliconflow:deepseek-ai/DeepSeek-V3">SiliconFlow DeepSeek-V3</option>
                    <option value="siliconflow:deepseek-ai/DeepSeek-R1">SiliconFlow DeepSeek-R1</option>
                    <option value="siliconflow:Qwen/Qwen2.5-VL-72B-Instruct">SiliconFlow Qwen2.5-VL</option>
                  </optgroup>
                  <optgroup label="自定义">
                    <option value="custom">自定义 OpenAI 兼容接口</option>
                  </optgroup>
                </select>
                <svg class="w-4 h-4 absolute right-3 top-3.5 text-ash pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </div>
              <p id="modelHint" class="text-xs text-slate mt-1.5 min-h-[1rem]"></p>
            </div>
            <div>
              <label class="block text-xs text-slate mb-1.5 font-medium">API Key <span class="text-sienna">*</span></label>
              <input type="password" id="apiKey" placeholder="sk-..." class="input-field w-full rounded-2xl px-3 py-2.5 text-sm text-ink placeholder-ash bg-paper">
            </div>
          </div>
        </section>

        <!-- Actions -->
        <section class="pt-4 border-t border-hairline">
          <div id="actionValidationMsg" class="hidden bg-peach/40 rounded-xl p-2.5 text-xs text-sienna border border-peach mb-3"></div>
          <button id="analyzeBtn" onclick="analyzeWithAI()" class="w-full btn-pill btn-pill-primary flex items-center justify-center gap-2 py-3" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            开始分析
          </button>
          <p class="text-xs text-ash mt-3 text-center">API Key 仅保存在浏览器本地，不会上传</p>
        </section>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 bg-fog min-h-screen relative">
      <!-- Empty State -->
      <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-center p-12">
        <div class="w-20 h-20 rounded-3xl bg-paper shadow-lg border border-hairline flex items-center justify-center mb-6">
          <svg class="w-9 h-9 text-sienna" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        </div>
        <h2 class="text-2xl section-title mb-3">准备好开始分析</h2>
        <p class="text-slate max-w-md text-sm leading-relaxed">在左侧上传策划文档并配置 AI 模型，点击「开始分析」后，结构化结果将展示在这里。</p>
      </div>

      <!-- Output Section -->
      <section id="outputSection" class="hidden p-6 lg:p-10">
        <div class="max-w-4xl mx-auto">
          <!-- Header -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
              <p class="text-ash text-xs font-medium tracking-wide mb-1">ANALYSIS RESULT</p>
              <h2 class="text-3xl section-title">分析结果</h2>
            </div>
            <button onclick="exportDocx()" class="btn-pill btn-pill-ghost flex items-center justify-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
              导出 DOCX
            </button>
          </div>

          <!-- Missing Content Check -->
          <div id="missingCheckBanner" class="hidden mb-6"></div>

          <!-- Step Navigation -->
          <div class="bg-paper rounded-2xl p-3 border border-hairline shadow-sm mb-6">
            <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-1" id="stepNav"></div>
          </div>

          <!-- Competitor Reference -->
          <div id="competitorSection" class="hidden mb-6"></div>

          <!-- Wireframe Section -->
          <div id="wireframeSection" class="hidden mb-6"></div>

          <!-- Structured Output -->
          <div id="structuredOutput" class="space-y-4"></div>

          <!-- Raw Output (hidden by default) -->
          <div id="rawOutput" class="hidden mt-6">
            <div class="output-section">
              <h3 class="text-lg font-semibold text-ink mb-3">原始输出</h3>
              <textarea id="outputText" readonly class="w-full h-64 bg-fog rounded-2xl p-4 text-sm text-ink focus:outline-none resize-none custom-scrollbar font-mono leading-relaxed border border-hairline"></textarea>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
<div id="wireframeTemplates" class="hidden"></div>

  <!-- Toast Status -->
  <div id="statusToast" class="fixed bottom-6 right-6 hidden toast z-50">
    <div class="bg-ink text-paper rounded-2xl px-4 py-3 flex items-center gap-3 shadow-2xl">
      <div id="statusIcon"></div>
      <span id="statusText" class="text-sm"></span>
    </div>
  </div>

  <script>
    // State
    let currentOutput = '';
    let parsedSections = [];
    let analyses = JSON.parse(localStorage.getItem('gamePrdAnalyses') || '[]');
    let uploadedImages = [];
    let parsedDocText = '';
    let statusTimeout = null;

    const STEP_TITLES = [
      '核心设计目标',
      '功能主干流程',
      '全部界面清单',

    function setupDragDrop() {
      const dropZone = document.getElementById('dropZone');
      if (!dropZone) return;
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
      });
      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-over'), false);
      });
      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          if (eventName === 'dragleave' && dropZone.contains(e.relatedTarget)) return;
          dropZone.classList.remove('drag-over');
        }, false);
      });
      dropZone.addEventListener('drop', handleDrop, false);
    }

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    function handleDrop(e) {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0) {
        const file = files[0];
        if (isDocumentFile(file)) {
          processFile(file);
        } else {
          showStatus('请上传 TXT / MD / DOCX / Excel 格式的策划文档', 'error');
        }
      }
    }

    function isDocumentFile(file) {
      const name = file.name.toLowerCase();
      return name.endsWith('.txt') || name.endsWith('.md') || name.endsWith('.docx') || name.endsWith('.xlsx') || name.endsWith('.xls');
    }

    async function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (!isDocumentFile(file)) {
        showStatus('请上传 TXT / MD / DOCX / Excel 格式的策划文档', 'error');
        return;
      }
      await processFile(file);
    }

    async function processFile(file) {
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('fileInfo').classList.remove('hidden');
      updateFileStatus('正在解析...', 'processing');

      try {
        if (file.name.endsWith('.docx')) {
          const arrayBuffer = await file.arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer });
          parsedDocText = result.value;
          updateFileStatus(`DOCX 解析完成，共 ${parsedDocText.length} 字符`, 'success');
          showStatus('DOCX 文档解析完成', 'success');
        } else if (file.name.match(/\.(xlsx|xls)$/)) {
          await handleExcelUpload(file);
        } else {
          const reader = new FileReader();
          reader.onload = (event) => {
            parsedDocText = event.target.result;
            updateFileStatus(`文本解析完成，共 ${parsedDocText.length} 字符`, 'success');
            showStatus('文档解析完成', 'success');
            validateAIConfig();
          };
          reader.readAsText(file);
          return;
        }
      } catch (err) {
        updateFileStatus('解析失败：' + err.message, 'error');
        showStatus('文档解析失败：' + err.message, 'error');
      }
      validateAIConfig();
    }

    function updateFileStatus(text, type) {
      const el = document.getElementById('fileStatus');
      const dotClass = type === 'processing' ? 'processing' : type === 'success' ? 'success' : type === 'error' ? 'error' : 'pending';
      const dotColor = type === 'success' ? 'text-emerald-600' : type === 'error' ? 'text-red-500' : type === 'processing' ? 'text-ink' : 'text-ash';
      el.innerHTML = `<span class="status-dot ${dotClass}"></span><span class="${dotColor}">${text}</span>`;
    }

    async function handleExcelUpload(file) {
      showStatus('正在解析 Excel...', 'loading');
      const data = await file.arrayBuffer();

      const workbook = XLSX.read(data, { type: 'array' });
      let textContent = '';
      workbook.SheetNames.forEach(sheetName => {
        const worksheet = workbook.Sheets[sheetName];
        textContent += `\n\n=== 工作表: ${sheetName} ===\n`;
        textContent += XLSX.utils.sheet_to_csv(worksheet);
      });
      parsedDocText = textContent.trim();

      try {
        const zip = await JSZip.loadAsync(data);
        const imageFiles = [];
        zip.forEach((relativePath, zipEntry) => {
          if (relativePath.startsWith('xl/media/') && !zipEntry.dir) {
            imageFiles.push(zipEntry);
          }
        });

        if (imageFiles.length > 0) {
          uploadedImages = [];
          for (const imgEntry of imageFiles) {
            const blob = await imgEntry.async('blob');
            const type = blob.type || 'image/png';
            const base64 = await blobToBase64(blob, type);
            uploadedImages.push({ name: imgEntry.name.split('/').pop(), type, size: blob.size, base64, source: 'excel' });
          }
          updateFileStatus(`Excel 解析完成，${parsedDocText.length} 字符，已提取 ${imageFiles.length} 张内嵌图片供 AI 分析`, 'success');
          showStatus(`Excel 解析完成，已提取 ${imageFiles.length} 张内嵌图片`, 'success');
        } else {
          updateFileStatus(`Excel 解析完成，${parsedDocText.length} 字符，未检测到内嵌图片`, 'success');
          showStatus('Excel 文字解析完成，未检测到内嵌图片', 'success');
        }
      } catch (err) {
        updateFileStatus(`Excel 文字解析完成，图片提取失败：${err.message}`, 'error');
        showStatus('Excel 文字解析完成，图片提取失败：' + err.message, 'error');
      }
    }

    function blobToBase64(blob, type) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.readAsDataURL(new Blob([blob], { type }));
      });
    }

### 1. 核心设计目标与信息架构预判

从策划文档中提炼系统核心定位。这里是你作为交互设计师"看完需求后建立的第一印象"，不要罗列原文句子，要做出判断。

- **系统核心目标**：该系统要解决玩家的什么核心问题？解决到什么程度算"好"？（一句话 + 简要说明）
- **目标玩家画像**：谁在用？在什么游戏阶段用？（新手/中期/后期？付费/免费？）
- **核心使用场景**：玩家在什么情境下触发该系统？（主城闲逛时 / 战斗结束后 / 查看战报 / 被推送唤起等）
- **信息架构预判**：根据需求内容量和操作类型，预判最可能的布局模式（卡片列表 / 网格橱窗 / 表格 / Tab 页签 / 折叠面板），并给出理由
- **首屏信息优先级**：哪些信息必须在首屏直接可见？哪些可以滚屏后看到？哪些可以收进二级页面？
- **系统业务目标与交互策略**：核心 KPI 是什么（留存/付费/活跃/社交），交互设计应如何服务于这个目标
- **系统入口位置**：在游戏内的什么入口？入口层级是否合理？入口是否需要视觉强化（红点/动效/气泡）？
- **潜在设计矛盾**：策划需求中是否存在目标自相矛盾、逻辑链缺失、或与已有系统冲突的地方

### 2. 功能主干流程与交互路径效率

不要只列流程步骤，要标注每条路径的交互效率。

**主干正向路径**（完成核心任务的最短操作序列）：
- 每条格式：步骤序号 → 当前界面 → 玩家操作 → 操作后结果 → 反馈形式
- 路径结束后标注总步数和总操作时间预估
- 指出是否存在可合并的冗余步骤 **【推演补充】**

**分支路径**：核心路径上的分叉，包括触发条件、返回方式

**中断与恢复路径**：
- 操作进行中被事件打断 → 恢复策略
- 操作后切后台/退出/断线再进入 → 状态恢复策略

**效率评估**：对比同类系统，核心任务操作步骤是否合理？是否有优化空间？**【推演补充】**

按界面类型分类输出。界面类型包括：

| 常驻 HUD | 始终显示在屏幕上的信息条（货币栏/状态栏等） |

| 侧边抽屉 / Drawer | 从侧边滑出的面板 |
| 浮层 / 气泡 / Tooltip | 点击或悬停出现的轻量信息层 |
| 二次确认弹窗 | 阻断性确认操作弹窗 |
| Toast 提示 | 短暂出现后自动消失的提示 |
| 全屏子页面 | 从主页推入的独立二级页面 |

### 4. 全界面状态枚举（交互设计交付核心）

这是交互设计师交付给 UI 和开发最重要的产出物。针对第 3 节的每个界面，按以下维度穷举全部展示状态：

- **默认常态**：首次进入、正常数据的展示

- **空数据态**：无数据时的展示（引导文案+引导按钮？纯空状态？是否给出操作入口？）
- **满上限 / 阈值态**：列表项达到上限、数量达到阈值时的展示和溢出处理
- **禁用态**：按钮/控件灰态的条件。灰态是隐藏还是保持但不可点？是否有文案提示为何不可用？
- **操作成功态**：操作成功的反馈形式（Toast 文案 / 动效 / 数值跳动 / 自动跳转？）
- **操作失败态**：区分不同失败原因（网络错误 / 服务器错误 / 条件不满足 / 资源不足），各自的反馈文案和玩家可执行的恢复操作
- **未解锁 / 离线态**：功能未开启时的入口表现（灰态+锁图标 / 红点+文字提示 / 完全隐藏？）
- **倒计时 / 时间限制态**：限时操作是否需要倒计时？倒计时结束后的表现？倒计时临界值的视觉强化？

### 7. 边界异常场景与容错设计

交互设计师的"防御性设计"章节，穷举所有可能出错的场景：

1. **网络异常**：弱网/断网时的 UI 表现、重连后状态恢复、请求超时兜底
2. **数据异常**：服务器返回空数据 / 错误数据结构 / 非法值时的表现
3. **操作容错**：连续快速点击的防抖策略、误操作撤销机制、不可逆操作二次确认
4. **外部打断**：操作中被系统弹窗 / 活动推送 / 私聊 / 来电打断后的状态恢复
5. **生命周期异常**：切后台/锁屏再回来、系统低内存回收后的页面恢复策略
6. **账号状态变更**：封号/禁言/被踢下线/强制更新等极端场景下该系统的表现
7. **边界数值**：0 值、负数、极大值、小数位精度等边界数据的展示方案
8. **系统竞态**：该系统的弹窗/操作是否会和其他系统（活动/战斗/社交）产生冲突？优先级如何？

          const geminiParts = [{ text: prompt }];
          if (includeImages) {
            uploadedImages.forEach(img => {
              const base64Data = img.base64.split(',')[1];
              geminiParts.push({ inline_data: { mime_type: img.type || 'image/png', data: base64Data } });
            });
          }
          body = { contents: [{ parts: geminiParts }] };
          headers = { 'Content-Type': 'application/json' };
          break;
        case 'aliyun':
          url = 'https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation';
          const qwenMessages = [{ role: 'user', content: [{ text: prompt }] }];
          if (includeImages) {
            uploadedImages.forEach(img => {
              const base64Data = img.base64.split(',')[1];
              qwenMessages[0].content.push({ image: base64Data });
            });
          }
          body = { model: config.model, messages: qwenMessages };
          headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
          break;
        case 'moonshot':
          url = 'https://api.moonshot.cn/v1/chat/completions';
          body = { model: config.model, messages: [{ role: 'user', content: prompt }], temperature: 0.3, max_tokens: 4000 };
          headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
          break;
        case 'deepseek':
          url = 'https://api.deepseek.com/chat/completions';
          body = { model: config.model, messages: [{ role: 'user', content: prompt }], temperature: 0.3, max_tokens: 4000 };
          headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
          break;
        case 'siliconflow':
          url = 'https://api.siliconflow.cn/v1/chat/completions';
          const sfContent = [{ type: 'text', text: prompt }];
          if (includeImages) {
            uploadedImages.forEach(img => {
              sfContent.push({ type: 'image_url', image_url: { url: img.base64, detail: 'auto' } });
            });
          }
          body = { model: config.model, messages: [{ role: 'user', content: sfContent }], temperature: 0.3, max_tokens: 4000 };
          headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
          break;
        case 'custom':
          url = prompt('请输入自定义 API 地址');
          if (!url) throw new Error('未提供自定义 API 地址');
          body = { model: config.model, messages: [{ role: 'user', content: prompt }], temperature: 0.3, max_tokens: 4000 };
          headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
          break;
      }

      const response = await fetch(url, {
        method: 'POST',
        headers,
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        const error = await response.text();
        throw new Error(`API 错误 (${response.status}): ${error}`);
      }

      const data = await response.json();
      return extractContent(config.provider, data);
    }

    function extractContent(provider, data) {
      switch(provider) {
        case 'anthropic':
          return data.content[0].text;
        case 'google':
          return data.candidates[0].content.parts[0].text;
        case 'aliyun':
          return data.output.choices[0].message.content;
        default:
          return data.choices[0].message.content;
      }
    }

    function displayOutput(text) {
      currentOutput = text;
      document.getElementById('outputText').value = text;
      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('outputSection').classList.remove('hidden');

      parsedSections = parseSections(text);
      renderStepNav();
      renderStructuredOutput();
      renderCompetitors();
      renderWireframeSelector();
      renderMissingContentCheck(text);

      document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });
    }

    function parseSections(text) {
      const sections = [];
      const regex = /###\s*(\d+)\.\s*([^\n]+)\n([\s\S]*?)(?=###\s*\d+\.|$)/g;
      let match;
      while ((match = regex.exec(text)) !== null) {
        sections.push({
          number: parseInt(match[1]),
          title: match[2].trim(),
          content: match[3].trim()
        });
      }
      if (sections.length === 0) {
        sections.push({
          number: 0,
          title: '分析输出',
          content: text
        });
      }
      return sections;
    }

    function renderStepNav() {
      const nav = document.getElementById('stepNav');
      nav.innerHTML = parsedSections.map((s, idx) => `
        <button onclick="scrollToSection(${s.number})" class="step-nav-item ${idx === 0 ? 'active' : ''}" data-step="${s.number}">
          ${s.number}. ${s.title.split(' ')[0]}
        </button>
      `).join('');
    }

    function scrollToSection(stepNumber) {
      const el = document.getElementById(`section-${stepNumber}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        document.querySelectorAll('.step-nav-item').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.querySelector(`.step-nav-item[data-step="${stepNumber}"]`);
        if (activeBtn) activeBtn.classList.add('active');
      }
    }

    function renderStructuredOutput() {
      const container = document.getElementById('structuredOutput');
      container.innerHTML = parsedSections.map(s => `
        <div id="section-${s.number}" class="output-section">
          <div class="flex items-start justify-between gap-4 mb-4">
            <div class="flex items-center gap-3">
              <span class="step-badge step-badge-active">${s.number}</span>
              <h3 class="output-section-title">${escapeHtml(s.title)}</h3>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              <button onclick="copySection(${s.number})" class="text-xs text-slate hover:text-ink font-medium px-2 py-1 rounded-lg hover:bg-mist transition-colors">复制本节</button>
              <button onclick="toggleSection(${s.number})" class="text-xs text-slate hover:text-ink font-medium px-2 py-1 rounded-lg hover:bg-mist transition-colors">
                <span id="toggle-text-${s.number}">折叠</span>
              </button>
            </div>
          </div>
          <div id="section-body-${s.number}" class="text-[15px] leading-relaxed text-ink space-y-2">
            ${formatSectionContent(s.content)}
          </div>
        </div>
      `).join('');
    }

    function formatSectionContent(content) {
      return content
        .split('\n')
        .map(line => {
          if (!line.trim()) return '';
          // Handle bullet points
          if (/^[-*•]\s+/.test(line)) {
            const text = line.replace(/^[-*•]\s+/, '');
            return `<div class="flex items-start gap-2 py-1"><span class="text-sienna mt-1.5">•</span><div class="flex-1">${highlightText(escapeHtml(text))}</div></div>`;
          }
          // Handle numbered lists
          if (/^\d+\.\s+/.test(line)) {
            return `<div class="flex items-start gap-2 py-1"><span class="text-slate text-sm mt-0.5 font-medium">${line.match(/^\d+/)[0]}.</span><div class="flex-1">${highlightText(escapeHtml(line.replace(/^\d+\.\s+/, '')))}</div></div>`;
          }
          // Handle bold markdown
          return `<div class="py-1">${highlightText(escapeHtml(line))}</div>`;
        })
        .filter(line => line)
        .join('');
    }

    function highlightText(text) {
      // Bold markdown
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong class="text-ink font-semibold">$1</strong>');
      // Missing tag
      text = text.replace(/（需求缺失，需与策划确认）/g, '<span class="missing-tag">需求缺失，需与策划确认</span>');
      text = text.replace(/【需求缺失，需与策划确认】/g, '<span class="missing-tag">需求缺失，需与策划确认</span>');
      text = text.replace(/\[需求缺失，需与策划确认\]/g, '<span class="missing-tag">需求缺失，需与策划确认</span>');
      // Supplement tag
      text = text.replace(/（推演补充）/g, '<span class="supplement-tag">推演补充</span>');
      text = text.replace(/【推演补充】/g, '<span class="supplement-tag">推演补充</span>');
      text = text.replace(/\[推演补充\]/g, '<span class="supplement-tag">推演补充</span>');
      return text;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function copySection(stepNumber) {
      const section = parsedSections.find(s => s.number === stepNumber);
      if (!section) return;
      const text = `### ${section.number}. ${section.title}\n\n${section.content}`;
      navigator.clipboard.writeText(text).then(() => {
        showStatus('本节已复制', 'success');
      });
    }

    function toggleSection(stepNumber) {
      const body = document.getElementById(`section-body-${stepNumber}`);
      const text = document.getElementById(`toggle-text-${stepNumber}`);
      body.classList.toggle('hidden');
      text.textContent = body.classList.contains('hidden') ? '展开' : '折叠';
    }


    function renderMissingContentCheck(text) {
      const banner = document.getElementById('missingCheckBanner');
      const checks = [];

      const lower = text.toLowerCase();
      const hasStateSection = /###\s*4\./.test(text);
      const hasExceptionSection = /###\s*7\./.test(text);
      const hasConfirmSection = /###\s*8\./.test(text);

      if (!hasStateSection) {
        checks.push('未找到「全界面状态枚举」章节，交互交付标准可能不完整');
      } else {
        const stateText = extractSectionText(text, 4);
        const stateKeywords = ['加载', '空数据', '失败', '禁用', '满上限', '未解锁', '离线'];
        const missingStates = stateKeywords.filter(k => !stateText.includes(k));
        if (missingStates.length > 0) {
          checks.push(`第 4 步状态枚举可能缺失：${missingStates.join(' / ')}`);
        }
      }

      if (!hasExceptionSection) {
        checks.push('未找到「边界异常场景」章节，容错设计覆盖可能不足');
      } else {
        const exceptionText = extractSectionText(text, 7);
        const exceptionKeywords = ['弱网', '断网', '重连', '连续点击', '打断', '切后台', '超时'];
        const missingExceptions = exceptionKeywords.filter(k => !exceptionText.includes(k));
        if (missingExceptions.length > 0) {
          checks.push(`第 7 步异常场景可能缺失：${missingExceptions.join(' / ')}`);
        }
      }

      if (!hasConfirmSection) {
        checks.push('未找到「需求缺陷与待确认」章节，建议与策划对齐的问题未汇总');
      }

      const interfaceText = extractSectionText(text, 3);
      const interfaceCount = (interfaceText.match(/界面名称/g) || []).length;
      if (interfaceCount === 0) {
        checks.push('未找到结构化界面清单，第 3 步输出可能不符合格式要求');
      }

      if (checks.length === 0) {
        banner.classList.add('hidden');
        return;
      }

      banner.classList.remove('hidden');
      banner.innerHTML = `
        <div class="missing-banner">
          <div class="flex items-center gap-2 mb-3">
            <svg class="w-5 h-5 text-sienna" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            <h3 class="missing-banner-title">检测到 ${checks.length} 处潜在缺失</h3>
          </div>
          <div class="space-y-1">
            ${checks.map(c => `<div class="missing-item">${c}</div>`).join('')}
          </div>
          <p class="text-xs text-slate mt-3">以上为基于输出结构的启发式检查，具体是否缺失需结合策划文档原文判断。</p>
        </div>
      `;
    }

    function extractSectionText(text, sectionNumber) {
      const regex = new RegExp("###\\s*" + sectionNumber + "\\.[^\\n]*\\n([\\s\\S]*?)(?=###\\s*\\d+\\.|$)");
      const match = text.match(regex);
      return match ? match[1] : '';
    }

    function renderWireframeSelector() {
      const section = document.getElementById('wireframeSection');

      if (!section3) {

      section.classList.remove('hidden');
      selector.innerHTML = interfaceNames.map((name, idx) => `

    function extractInterfaceNames(content) {
      const names = [];
      const regex = /\*\*界面名称\*\*[:：]\s*([^\n]+)/g;
      let match;
      while ((match = regex.exec(content)) !== null) {
        names.push(match[1].trim());
      }
      if (names.length === 0) {
        // fallback: try to find any bold text that looks like interface name
        const lines = content.split('\n');
        lines.forEach(line => {
          const m = line.match(/\*\*([^*]+(?:页面|界面|弹窗|面板|浮层))\*\*/);
          if (m && !names.includes(m[1])) names.push(m[1]);
        });
      }
      return names.slice(0, 8);
    }

    function wireframeConfirmMobile(name) {
      return `
        <div class="wireframe-device">

              <div style="width:60%;height:16px;background:#fff;border-radius:4px;margin:0 auto 14px;"></div>
              <div style="width:100%;height:80px;background:#222;border-radius:10px;margin-bottom:14px;"></div>
              <div style="display:flex;justify-content:space-between;margin-bottom:16px;">

                <div style="flex:1;height:36px;background:#333;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px;">取消</div>
                <div style="flex:1;height:36px;background:#fbe1d1;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#5d2a1a;font-size:12px;font-weight:600;">确认购买</div>

    function wireframeConfirmPC(name) {
      return `
        <div class="wireframe-screen-pc" style="width:480px;height:270px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);">
          <div style="width:320px;background:#1e1e22;border-radius:16px;padding:20px;border:1px solid #333;">
            <div style="width:50%;height:18px;background:#fff;border-radius:4px;margin:0 auto 16px;"></div>
            <div style="width:100%;height:90px;background:#222;border-radius:10px;margin-bottom:16px;"></div>
            <div style="display:flex;justify-content:space-between;margin-bottom:18px;">
              <div style="width:100px;height:14px;background:#555;border-radius:4px;"></div>
              <div style="width:80px;height:16px;background:#fbe1d1;border-radius:4px;"></div>

            <div style="display:flex;gap:12px;">
              <div style="flex:1;height:38px;background:#333;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px;">取消</div>
              <div style="flex:1;height:38px;background:#fbe1d1;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#5d2a1a;font-size:13px;font-weight:600;">确认购买</div>
            </div>
          </div>
        </div>
      `;
    }

    async function exportWireframe(encodedName) {
      const wrapper = document.getElementById(`wf-${encodedName}`);
      if (!wrapper) return;
      const canvas = await html2canvas(wrapper.firstElementChild, { backgroundColor: null, scale: 2 });
      const link = document.createElement('a');
      link.download = `wireframe-${decodeURIComponent(encodedName)}.png`;
      link.href = canvas.toDataURL();
      link.click();
      showStatus('效果图已导出', 'success');
    }

    async function exportAllWireframes() {
      const checked = Array.from(document.querySelectorAll('.wireframe-checkbox:checked'));
      if (checked.length === 0) {
        showStatus('请至少选择一个界面', 'error');
        return;
      }
      for (const cb of checked) {
        await exportWireframe(encodeURIComponent(cb.value));
        await new Promise(r => setTimeout(r, 300));
      }
      showStatus('全部效果图已导出', 'success');
    }

    function exportMarkdown() {
      if (!currentOutput) {
        showStatus('请先生成分析结果', 'error');
        return;
      }
      const blob = new Blob([currentOutput], { type: 'text/markdown' });
      saveAs(blob, `PRD分析_${new Date().toISOString().slice(0,10)}.md`);
    }

    function exportDocx() {
      if (!currentOutput) {
        showStatus('请先生成分析结果', 'error');
        return;
      }

      const { Document, Paragraph, HeadingLevel, Packer, TextRun } = docx;
      const lines = currentOutput.split('\n');
      const children = [];

      lines.forEach(line => {
        if (line.startsWith('# ')) {
          children.push(new Paragraph({ text: line.replace('# ', ''), heading: HeadingLevel.HEADING_1 }));
        } else if (line.startsWith('## ')) {
          children.push(new Paragraph({ text: line.replace('## ', ''), heading: HeadingLevel.HEADING_2 }));
        } else if (line.startsWith('### ')) {
          children.push(new Paragraph({ text: line.replace('### ', ''), heading: HeadingLevel.HEADING_3 }));
        } else if (line.startsWith('- ') || line.startsWith('* ')) {
          children.push(new Paragraph({ text: line.replace(/^[-*] /, ''), bullet: { level: 0 } }));
        } else if (line.trim()) {
          children.push(new Paragraph({ text: line }));
        }
      });

      const doc = new Document({ sections: [{ properties: {}, children }] });
      Packer.toBlob(doc).then(blob => {
        saveAs(blob, `PRD分析_${new Date().toISOString().slice(0,10)}.docx`);
      });
    }

    function copyOutput() {
      if (!currentOutput) return;
      navigator.clipboard.writeText(currentOutput).then(() => {
        showStatus('分析结果已复制', 'success');
      });
    }

    function saveAnalysis(input, output) {
      const title = input.split('\n')[0].replace(/^【?/, '').replace(/】?$/, '').substring(0, 30) || '未命名分析';
      const analysis = {
        id: Date.now(),
        title,
        date: new Date().toLocaleString('zh-CN'),
        input: input.substring(0, 200),
        output: output.substring(0, 100)
      };
      analyses.unshift(analysis);
      if (analyses.length > 20) analyses = analyses.slice(0, 20);
      localStorage.setItem('gamePrdAnalyses', JSON.stringify(analyses));
      renderHistory();
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      if (!container) return;
      if (analyses.length === 0) {
        container.innerHTML = '<p class="text-sm text-ash text-center py-8">暂无历史记录</p>';
        return;
      }
      container.innerHTML = analyses.map(a => `
        <div class="p-3 rounded-xl bg-paper border border-hairline cursor-pointer hover:bg-fog hover:border-hairline transition-all" onclick="loadAnalysis(${a.id})">
          <div class="text-sm text-ink font-medium truncate">${a.title}</div>
          <div class="text-xs text-ash mt-1">${a.date}</div>
        </div>
      `).join('');
    }

    function loadAnalysis(id) {
      const analysis = analyses.find(a => a.id === id);
      if (analysis) {
        showStatus('历史记录仅保存摘要，完整结果请重新生成', 'info');
      }
    }

    function clearHistory() {
      analyses = [];
      localStorage.removeItem('gamePrdAnalyses');
      renderHistory();
    }

    function loadApiKey() {
      const key = localStorage.getItem('gamePrdAnalyzerApiKey');
      if (key) document.getElementById('apiKey').value = key;
    }

    function showStatus(message, type) {
      const toast = document.getElementById('statusToast');
      const text = document.getElementById('statusText');
      const icon = document.getElementById('statusIcon');

      text.textContent = message;

      const icons = {
        success: '<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>',
        error: '<svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>',
        loading: '<div class="w-5 h-5 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>',
        info: '<svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'
      };
      icon.innerHTML = icons[type] || icons.info;

      toast.classList.remove('hidden');

      if (statusTimeout) clearTimeout(statusTimeout);
      statusTimeout = setTimeout(() => {
        toast.classList.add('hidden');
      }, type === 'error' ? 5000 : 3500);
    }
  </script>
